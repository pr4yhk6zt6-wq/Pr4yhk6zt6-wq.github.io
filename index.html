<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PySlide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 64px 24px;
    -webkit-font-smoothing: antialiased;
}

.shell {
    width: 100%;
    max-width: 720px;
}

header {
    margin-bottom: 48px;
    border-bottom: 1px solid #e5e5e5;
    padding-bottom: 24px;
}

h1 {
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.03em;
}

.tagline {
    font-size: 0.8125rem;
    font-weight: 300;
    color: #737373;
    margin-top: 6px;
}

section {
    margin-bottom: 40px;
}

.label {
    display: block;
    font-size: 0.6875rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #737373;
    margin-bottom: 12px;
}

.field {
    margin-bottom: 16px;
}

input[type="text"],
textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    color: #1a1a1a;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 2px;
    padding: 14px 16px;
    transition: border-color 0.15s ease;
    outline: none;
    resize: vertical;
}

input[type="text"]:focus,
textarea:focus {
    border-color: #1a1a1a;
}

textarea {
    min-height: 100px;
    line-height: 1.6;
}

.field-hint {
    font-size: 0.75rem;
    font-weight: 300;
    color: #a3a3a3;
    margin-top: 6px;
}

.row {
    display: flex;
    gap: 12px;
    align-items: stretch;
}

.btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 14px 24px;
    border: 1px solid #1a1a1a;
    background: #1a1a1a;
    color: #ffffff;
    border-radius: 2px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
}

.btn:hover { background: #333333; border-color: #333333; }

.btn-ghost {
    background: transparent;
    color: #1a1a1a;
}

.btn-ghost:hover {
    background: #f0f0f0;
    color: #1a1a1a;
    border-color: #1a1a1a;
}

.btn:disabled {
    background: #d4d4d4;
    border-color: #d4d4d4;
    color: #ffffff;
    cursor: not-allowed;
}

.slides {
    border-top: 1px solid #e5e5e5;
}

.slide-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 0;
    border-bottom: 1px solid #e5e5e5;
}

.slide-meta {
    display: flex;
    gap: 16px;
    flex: 1;
    min-width: 0;
}

.slide-index {
    font-size: 0.75rem;
    font-weight: 400;
    color: #a3a3a3;
    padding-top: 2px;
    min-width: 20px;
}

.slide-body { flex: 1; min-width: 0; }

.slide-title {
    font-size: 0.875rem;
    font-weight: 500;
    color: #1a1a1a;
    margin-bottom: 4px;
    word-break: break-word;
}

.slide-preview {
    font-size: 0.75rem;
    font-weight: 300;
    color: #737373;
    line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
}

.remove {
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.6875rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a3a3a3;
    cursor: pointer;
    padding: 4px 0;
    transition: color 0.15s ease;
    flex-shrink: 0;
}

.remove:hover { color: #b91c1c; }

.empty {
    padding: 32px 0;
    text-align: center;
    font-size: 0.8125rem;
    font-weight: 300;
    color: #a3a3a3;
    border-bottom: 1px solid #e5e5e5;
}

.actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
}

.actions .btn { flex: 1; }

footer {
    margin-top: 48px;
    font-size: 0.6875rem;
    font-weight: 300;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #a3a3a3;
    text-align: center;
}

@media (max-width: 540px) {
    body { padding: 40px 16px; }
    .row { flex-direction: column; }
    .actions { flex-direction: column; }
}
</style>
</head>
<body>

<div class="shell">
    <header>
        <h1>PySlide</h1>
        <p class="tagline">Compose slides. Export a presentation.</p>
    </header>

    <section>
        <span class="label">New Slide</span>
        <div class="field">
            <input type="text" id="slideTitle" placeholder="Slide title" maxlength="120">
        </div>
        <div class="field">
            <textarea id="slideBody" placeholder="One point per line"></textarea>
            <p class="field-hint">Each new line becomes a bullet point.</p>
        </div>
        <div class="row">
            <button type="button" class="btn" id="addBtn">Add Slide</button>
            <button type="button" class="btn btn-ghost" id="clearFormBtn">Clear</button>
        </div>
    </section>

    <section>
        <span class="label">Deck</span>
        <div class="slides" id="slides"></div>
        <div class="actions">
            <button type="button" class="btn" id="exportBtn" disabled>Export Presentation</button>
            <button type="button" class="btn btn-ghost" id="resetBtn" disabled>Reset Deck</button>
        </div>
    </section>

    <footer id="footer">PptxGenJS in the browser</footer>
</div>

<script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
const state = { slides: [] };

const els = {
    slideTitle: document.getElementById('slideTitle'),
    slideBody: document.getElementById('slideBody'),
    addBtn: document.getElementById('addBtn'),
    clearFormBtn: document.getElementById('clearFormBtn'),
    slides: document.getElementById('slides'),
    exportBtn: document.getElementById('exportBtn'),
    resetBtn: document.getElementById('resetBtn'),
    footer: document.getElementById('footer'),
};

function render() {
    els.slides.innerHTML = '';

    if (state.slides.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No slides yet';
        els.slides.appendChild(empty);
    } else {
        state.slides.forEach((slide, index) => {
            const item = document.createElement('div');
            item.className = 'slide-item';

            const meta = document.createElement('div');
            meta.className = 'slide-meta';

            const idx = document.createElement('div');
            idx.className = 'slide-index';
            idx.textContent = String(index + 1).padStart(2, '0');

            const body = document.createElement('div');
            body.className = 'slide-body';

            const title = document.createElement('div');
            title.className = 'slide-title';
            title.textContent = slide.title || 'Untitled';

            const preview = document.createElement('div');
            preview.className = 'slide-preview';
            preview.textContent = slide.bullets.length > 0
                ? slide.bullets.join(' · ')
                : 'No content';

            body.appendChild(title);
            body.appendChild(preview);

            meta.appendChild(idx);
            meta.appendChild(body);

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'remove';
            remove.textContent = 'Remove';
            remove.addEventListener('click', () => {
                state.slides.splice(index, 1);
                render();
            });

            item.appendChild(meta);
            item.appendChild(remove);
            els.slides.appendChild(item);
        });
    }

    const hasSlides = state.slides.length > 0;
    els.exportBtn.disabled = !hasSlides;
    els.resetBtn.disabled = !hasSlides;
    els.footer.textContent = hasSlides
        ? state.slides.length + ' slide' + (state.slides.length > 1 ? 's' : '') + ' ready'
        : 'PptxGenJS in the browser';
}

function addSlide() {
    const title = els.slideTitle.value.trim();
    const body = els.slideBody.value.trim();

    if (!title && !body) return;

    const bullets = body
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0);

    state.slides.push({ title, bullets });
    els.slideTitle.value = '';
    els.slideBody.value = '';
    els.slideTitle.focus();
    render();
}

async function exportDeck() {
    if (state.slides.length === 0) return;

    els.exportBtn.disabled = true;
    els.footer.textContent = 'Building presentation';

    try {
        const pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';
        pptx.author = 'PySlide';
        pptx.title = 'Presentation';

        state.slides.forEach((slide) => {
            const s = pptx.addSlide();

            if (slide.title) {
                s.addText(slide.title, {
                    x: 0.6,
                    y: 0.5,
                    w: '90%',
                    h: 1.0,
                    fontSize: 32,
                    fontFace: 'Inter',
                    bold: true,
                    color: '1A1A1A',
                    valign: 'top',
                });
            }

            if (slide.bullets.length > 0) {
                s.addText(
                    slide.bullets.map(text => ({ text, options: { bullet: true } })),
                    {
                        x: 0.6,
                        y: slide.title ? 1.7 : 0.8,
                        w: '90%',
                        h: '70%',
                        fontSize: 18,
                        fontFace: 'Inter',
                        color: '333333',
                        lineSpacingMultiple: 1.4,
                        valign: 'top',
                    }
                );
            }
        });

        await pptx.writeFile({ fileName: 'presentation.pptx' });
        els.footer.textContent = 'Presentation downloaded';
    } catch (err) {
        els.footer.textContent = 'Export failed: ' + err.message;
    } finally {
        render();
    }
}

els.addBtn.addEventListener('click', addSlide);

els.clearFormBtn.addEventListener('click', () => {
    els.slideTitle.value = '';
    els.slideBody.value = '';
    els.slideTitle.focus();
});

els.exportBtn.addEventListener('click', exportDeck);

els.resetBtn.addEventListener('click', () => {
    if (state.slides.length === 0) return;
    if (!confirm('Remove all slides from the deck?')) return;
    state.slides = [];
    render();
});

els.slideTitle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        els.slideBody.focus();
    }
});

els.slideBody.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        addSlide();
    }
});

render();
</script>
</body>
</html>
