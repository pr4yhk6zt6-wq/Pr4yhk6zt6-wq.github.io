<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PySlide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid #e5e5e5;
    background: #ffffff;
}

.brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
}

.brand h1 {
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: -0.01em;
}

.brand span {
    font-size: 0.6875rem;
    font-weight: 300;
    color: #a3a3a3;
    letter-spacing: 0.04em;
    text-transform: uppercase;
}

.topbar-actions {
    display: flex;
    gap: 8px;
}

.btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.6875rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 18px;
    border: 1px solid #1a1a1a;
    background: #1a1a1a;
    color: #ffffff;
    border-radius: 2px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.btn:hover { background: #333333; border-color: #333333; }

.btn-ghost {
    background: transparent;
    color: #1a1a1a;
    border-color: #d4d4d4;
}

.btn-ghost:hover {
    background: transparent;
    color: #1a1a1a;
    border-color: #1a1a1a;
}

.btn:disabled {
    background: #d4d4d4;
    border-color: #d4d4d4;
    color: #ffffff;
    cursor: not-allowed;
}

.workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: #e5e5e5;
    min-height: 0;
}

.pane {
    background: #ffffff;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
}

.pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid #e5e5e5;
    background: #ffffff;
}

.pane-title {
    font-size: 0.6875rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #737373;
}

.pane-meta {
    font-size: 0.6875rem;
    font-weight: 300;
    color: #a3a3a3;
    font-family: 'JetBrains Mono', monospace;
}

.editor-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
    display: flex;
}

textarea {
    flex: 1;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 20px 20px 20px 56px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8125rem;
    line-height: 1.7;
    color: #1a1a1a;
    background: transparent;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
}

.gutter {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 40px;
    padding: 20px 0;
    background: #fafafa;
    border-right: 1px solid #e5e5e5;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8125rem;
    line-height: 1.7;
    color: #c4c4c4;
    text-align: right;
    padding-right: 10px;
    overflow: hidden;
    user-select: none;
    pointer-events: none;
}

.dropzone-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.92);
    border: 1px dashed #1a1a1a;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 0.8125rem;
    font-weight: 400;
    color: #1a1a1a;
    letter-spacing: 0.04em;
    pointer-events: none;
}

.editor-wrap.dragging .dropzone-overlay {
    display: flex;
}

.console {
    flex: 1;
    overflow: auto;
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    line-height: 1.7;
    color: #525252;
    background: #ffffff;
    min-height: 0;
}

.console-line {
    display: flex;
    gap: 12px;
    padding: 2px 0;
    white-space: pre-wrap;
    word-break: break-word;
}

.console-line .tag {
    flex-shrink: 0;
    color: #a3a3a3;
    width: 60px;
}

.console-line.info .tag { color: #a3a3a3; }
.console-line.log .tag { color: #737373; }
.console-line.error { color: #b91c1c; }
.console-line.error .tag { color: #b91c1c; }
.console-line.success { color: #15803d; }
.console-line.success .tag { color: #15803d; }

.console-empty {
    color: #c4c4c4;
}

.footer {
    padding: 12px 32px;
    border-top: 1px solid #e5e5e5;
    background: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.6875rem;
    font-weight: 300;
    color: #a3a3a3;
    letter-spacing: 0.02em;
}

.footer kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6875rem;
    border: 1px solid #e5e5e5;
    border-radius: 2px;
    padding: 2px 6px;
    color: #525252;
    background: #fafafa;
}

@media (max-width: 800px) {
    .workspace { grid-template-columns: 1fr; }
    .topbar { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
    .footer { padding: 12px 20px; }
    .brand span { display: none; }
}
</style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <h1>PySlide</h1>
        <span>JS to PPTX</span>
    </div>
    <div class="topbar-actions">
        <button type="button" class="btn btn-ghost" id="clearBtn">Clear</button>
        <button type="button" class="btn" id="runBtn">Run</button>
    </div>
</header>

<main class="workspace">
    <section class="pane">
        <div class="pane-head">
            <span class="pane-title">Script</span>
            <span class="pane-meta" id="lineInfo">0 lines</span>
        </div>
        <div class="editor-wrap" id="editorWrap">
            <div class="gutter" id="gutter">1</div>
            <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
            <div class="dropzone-overlay">Drop a .js file</div>
        </div>
    </section>

    <section class="pane">
        <div class="pane-head">
            <span class="pane-title">Output</span>
            <span class="pane-meta" id="statusInfo">Idle</span>
        </div>
        <div class="console" id="console"></div>
    </section>
</main>

<footer class="footer">
    <span>API: pptx, PptxGenJS</span>
    <span><kbd>Ctrl</kbd> <kbd>Enter</kbd> to run</span>
</footer>

<script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
const DEFAULT_SCRIPT = `const slide = pptx.addSlide();

slide.addText("Quarterly Report", {
  x: 0.6,
  y: 0.6,
  w: 9,
  h: 1,
  fontSize: 36,
  bold: true,
  color: "1A1A1A"
});

slide.addText("Generated in the browser", {
  x: 0.6,
  y: 1.8,
  w: 9,
  h: 1,
  fontSize: 16,
  color: "737373"
});

await pptx.writeFile({ fileName: "presentation.pptx" });`;

const editor = document.getElementById('editor');
const gutter = document.getElementById('gutter');
const lineInfo = document.getElementById('lineInfo');
const consoleEl = document.getElementById('console');
const statusInfo = document.getElementById('statusInfo');
const runBtn = document.getElementById('runBtn');
const clearBtn = document.getElementById('clearBtn');
const editorWrap = document.getElementById('editorWrap');

const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;

let running = false;

function syncGutter() {
    const lines = editor.value.split('\n').length;
    let out = '';
    for (let i = 1; i <= lines; i++) out += i + '\n';
    gutter.textContent = out;
    lineInfo.textContent = lines + (lines === 1 ? ' line' : ' lines');
}

function appendLine(text, type) {
    const line = document.createElement('div');
    line.className = 'console-line ' + (type || 'log');

    const tag = document.createElement('span');
    tag.className = 'tag';

    const stamp = new Date();
    const hh = String(stamp.getHours()).padStart(2, '0');
    const mm = String(stamp.getMinutes()).padStart(2, '0');
    const ss = String(stamp.getSeconds()).padStart(2, '0');
    tag.textContent = hh + ':' + mm + ':' + ss;

    const body = document.createElement('span');
    body.textContent = text;

    line.appendChild(tag);
    line.appendChild(body);
    consoleEl.appendChild(line);
    consoleEl.scrollTop = consoleEl.scrollHeight;
}

function clearConsole() {
    consoleEl.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'console-empty';
    empty.textContent = 'Waiting for output';
    consoleEl.appendChild(empty);
}

function setStatus(text) {
    statusInfo.textContent = text;
}

const customConsole = {
    log: (...args) => appendLine(args.map(formatArg).join(' '), 'log'),
    info: (...args) => appendLine(args.map(formatArg).join(' '), 'info'),
    warn: (...args) => appendLine(args.map(formatArg).join(' '), 'log'),
    error: (...args) => appendLine(args.map(formatArg).join(' '), 'error'),
    clear: clearConsole,
};

function formatArg(value) {
    if (typeof value === 'string') return value;
    try { return JSON.stringify(value); }
    catch (e) { return String(value); }
}

async function run() {
    if (running) return;
    running = true;
    runBtn.disabled = true;
    setStatus('Running');

    const first = consoleEl.querySelector('.console-empty');
    if (first) consoleEl.innerHTML = '';

    appendLine('Execution started', 'info');

    const code = editor.value;
    const pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_16x9';
    pptx.author = 'PySlide';
    pptx.title = 'Presentation';

    const startedAt = performance.now();

    try {
        const fn = new AsyncFunction('pptx', 'PptxGenJS', 'console', code);
        await fn(pptx, PptxGenJS, customConsole);

        const elapsed = (performance.now() - startedAt).toFixed(0);
        appendLine('Finished in ' + elapsed + ' ms', 'success');
        setStatus('Done');
    } catch (err) {
        const message = err && err.message ? err.message : String(err);
        appendLine(message, 'error');
        if (err && err.stack) {
            const firstFrame = err.stack.split('\n')[1];
            if (firstFrame) appendLine(firstFrame.trim(), 'error');
        }
        setStatus('Failed');
    } finally {
        running = false;
        runBtn.disabled = false;
    }
}

editor.addEventListener('input', syncGutter);

editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        syncGutter();
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        run();
    }
});

editorWrap.addEventListener('dragover', (e) => {
    e.preventDefault();
    editorWrap.classList.add('dragging');
});

editorWrap.addEventListener('dragleave', () => {
    editorWrap.classList.remove('dragging');
});

editorWrap.addEventListener('drop', async (e) => {
    e.preventDefault();
    editorWrap.classList.remove('dragging');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.js')) {
        appendLine('Only .js files are accepted', 'error');
        return;
    }
    const text = await file.text();
    editor.value = text;
    syncGutter();
    appendLine('Loaded ' + file.name, 'info');
});

runBtn.addEventListener('click', run);

clearBtn.addEventListener('click', () => {
    editor.value = '';
    syncGutter();
    clearConsole();
    setStatus('Idle');
    editor.focus();
});

editor.value = DEFAULT_SCRIPT;
syncGutter();
clearConsole();
setStatus('Idle');
</script>
</body>
</html>
